# GoodsteinPA — Track 2 of the Goodstein effort: the syntactic `𝗣𝗔 ⊬ γ` (Kirby–Paris).
# Built on the `Foundation` monorepo (FormalizedFormalLogic), which supplies first-order logic,
# PA (`𝗣𝗔 = Peano : ArithmeticTheory`), Σ₁ arithmetization, and Gödel II. Track 1 (the
# mathlib-only growth theory) lives in ~/src/lean-formalizations.
#
# Foundation is the upstream FormalizedFormalLogic/Foundation monorepo, pinned by rev in the
# [[require]] block below. This previously pointed at a personal v4.31 fork (gotrevor/Foundation)
# that carried the forward-port plus the Δ₁-definability discharge; both have since landed upstream
# (#830, #833), so the dependency is re-homed onto upstream master and there is no fork infra left
# to track. The pin sits at the v4.31.0 mathlib commit (fabf563a), matching this repo's toolchain,
# so a build only recompiles Foundation itself while mathlib oleans Replay from cache. Bump the
# rev by hand as upstream advances.
name = "GoodsteinPA"
# Build BOTH libs by default: the public root AND the blueprint root. Without the latter in
# defaultTargets, a bare `lake build` (the local .githooks gate + CI's lean-action) never compiles
# the Path B nodes, so `lake exe blueprint_audit` would audit stale/absent oleans (a vacuous gate).
defaultTargets = ["GoodsteinPA", "GoodsteinPABlueprint"]
srcDir = "src"

[[lean_lib]]
name = "GoodsteinPA"

[[lean_lib]]
name = "GoodsteinPABlueprint"

# The leanprover/comparator harness (Comparator/Goodstein/{Challenge,Solution}.lean). Deliberately
# NOT in defaultTargets and NOT reachable from the main roots: the Challenge carries `sorry` by
# design and the main libs build warnings-as-errors, so this must stay out of the default build.
# The package sets `srcDir = "src"`, but the harness lives at repo root under `Comparator/` (matching
# tao-collatz / lean-gallery layout), so this lib overrides `srcDir = "."`. Build explicitly with
# `lake build Comparator`; the real gate is `.github/workflows/comparator.yml`.
[[lean_lib]]
name = "Comparator"
srcDir = ".."
globs = ["Comparator.+"]

# Machine-verified blueprint status gate. Computes each `@[goodstein_blueprint]` node's real
# `collectAxioms` footprint and reconciles it against the category claim. `supportInterpreter`
# lets `importModules` run imported modules' initializers (registering env extensions) at runtime,
# the same way `checkdecls` does. Run: `lake exe blueprint_audit [trusted-axioms.txt]`.
[[lean_exe]]
name = "blueprint_audit"
root = "BlueprintAudit"
supportInterpreter = true

[[require]]
name = "Foundation"
git = "https://github.com/FormalizedFormalLogic/Foundation.git"
rev = "2040d2f33807c34636b8a9f20189d22b48d65040"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"

# The Kirby–Paris hydra (gallery `Hydra` / `Chop` / `Step` + the canonical battle), for the
# stage-2 independence result.  Only `LeanGallery.Logic.Hydra.*` is imported; the gallery's own
# mathlib pin is overridden by this repo's (Foundation's), and the hydra files compile on both.
[[require]]
name = "LeanGallery"
git = "https://github.com/gotrevor/lean-gallery.git"
rev = "4422092b7b50182b77c317462d58714035a5bd74"
